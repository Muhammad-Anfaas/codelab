    <script>
      // Apply the saved theme before the page paints, so there is no flash.
      // Keep in sync with src/hooks/useTheme.js.
      (function () {
        try {
          var saved = localStorage.getItem('codelab-theme');
          var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light'; // storage blocked
        }
      })();
    </script>
